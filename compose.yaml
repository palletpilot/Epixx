services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lagerkraft
      POSTGRES_PASSWORD: lagerkraft
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./compose/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lagerkraft -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.11
    command: ["--jetstream", "--http_port", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
